[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physiocat-reproducibility"
version = "1.0.0"
description = "Reproducibility artifact for the PhysioCAT manuscript"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.7", "PyMuPDF>=1.24", "PyYAML>=6", "PyWavelets>=1.5", "h5py>=3.10", "torch>=2.1"]

[project.urls]
Repository = "https://github.com/shangyr/PhysioCAT"
Documentation = "https://github.com/shangyr/PhysioCAT#readme"
Issues = "https://github.com/shangyr/PhysioCAT/issues"

[tool.setuptools.packages.find]
where = ["src"]

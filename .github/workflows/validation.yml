name: validation

on:
  push:
    branches: [main]
    tags: ["bspc-submission-*", "bspc-revision-*", "accepted-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements/requirements-lock.txt
      - run: python scripts/reproduce/reproduce_all.py
      - run: python -m pytest -q tests

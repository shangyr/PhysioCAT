kind: model
name: mufubp_net
inputs:
- ECG
- PPG
input_view: window_robust
training:
  configuration_policy: fold_local_validation_from_fixed_three_candidate_grid
  validation_objective: mean(SBP_MAE, DBP_MAE)
  checkpoint_rule: minimum subject-disjoint validation objective
output:
  targets:
  - SBP
  - DBP
  loss: Huber_plus_order_penalty
  loss_parameters:
    huber_delta_mmHg: 5.0
    minimum_sbp_minus_dbp_mmHg: 0.0
    order_weight: 0.15
architecture:
  hidden_dim: 128
  morphology_streams: 2
  dynamic_streams: 2
  cross_attention_heads: 8
  fusion_transformer_layers: 2
  probabilistic_latent_dim: 96
training_protocol:
  contrastive_pretraining: false
  configuration_policy: fold_local_validation_from_fixed_three_candidate_grid
  validation_subjects_disjoint: true
  scheduler: cosine_with_warmup
  auxiliary_loss: Gaussian KL
implementation:
  status: paper_aligned_common_protocol_implementation
  source: published MuFuBP-Net specification
  common_protocol_adaptations:
  - common 8-s inputs
  - ECG+PPG-only input contract
  - two-component BP output
  - KL regularization

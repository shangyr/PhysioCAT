kind: model
name: uniform_delay_band
inputs:
- ECG
- PPG
- local_SQI
input_view: window_robust
architecture:
  hidden_dim: 128
  attention_heads: 4
  token_spacing_ms: 64
  patch_samples: 16
  waveform_encoder_context_ms: 64
  sqi_reliability_context_ms: 1000
  modality_encoder: local_patch_projection_plus_token_wise_residual_mlp
  token_mlp_linear_layers: 2
  joint_fusion_inputs: edge_aligned_ECG_and_PPG_values
  fusion_index: exact_admissible_ECG_PPG_edge
  reciprocal_edge_affinity: geometric_mean_of_opposite_query_key_assignments
  edge_sqi: geometric_mean_of_ECG_query_and_PPG_key_quality
  second_attention_routing: false
  modality_residual_bypass: false
  post_fusion_temporal_layers: 2
training:
  configuration_policy: fold_local_validation_from_fixed_three_candidate_grid
  validation_objective: mean(SBP_MAE, DBP_MAE)
  checkpoint_rule: minimum subject-disjoint validation objective
output:
  targets:
  - SBP
  - DBP
  loss: Huber_plus_order_penalty
  loss_parameters:
    huber_delta_mmHg: 5.0
    minimum_sbp_minus_dbp_mmHg: 0.0
    order_weight: 0.15
cross_attention:
  direction: ECG-leading PPG
  delay_band_ms:
  - 120
  - 450
  weighting: fixed_uniform_over_admissible_edges
  matched_backbone: physiocat
  learnable_query_key_scores: false
